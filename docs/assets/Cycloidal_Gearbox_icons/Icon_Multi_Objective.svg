<svg viewBox="0 0 80 80" width="80" height="80" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Axes ultra-épurés -->
  <path d="M 10,70 L 75,70 M 10,70 L 10,10" fill="none" stroke="#aa00ff" stroke-width="1" opacity="0.4"/>

  <!-- La Fonction Objectif (Courbe avec minimum local et global) -->
  <path d="M 10,30 Q 20,70 32,45 T 52,35 Q 65,80 75,45" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.9"/>

  <!-- ========================================== -->
  <!-- Validation du Minimum (Ligne & Texte)      -->
  <!-- ========================================== -->
  <g opacity="0">
    <!-- Apparaît à 70% de l'animation (quand le point s'arrête) et disparaît en fondu à la fin -->
    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.70; 0.72; 0.90; 0.95; 1" dur="6s" repeatCount="indefinite"/>
    
    <line x1="10" y1="60.3" x2="65.6" y2="60.3" stroke="#ffe566" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="12" y="58" font-size="4" fill="#ffe566" font-family="monospace">Min</text>
  </g>

  <!-- ========================================== -->
  <!-- L'Agent d'optimisation (Le point mobile)   -->
  <!-- ========================================== -->
  <g>
    <!-- Le point principal -->
    <circle r="2.5" fill="#ffe566">
      <!-- Mouvement ralenti (6s). Il s'arrête définitivement (keyPoint 0.82) à la fin du tracé. -->
      <animateMotion dur="6s" repeatCount="indefinite" path="M 10,30 Q 20,70 32,45 T 52,35 Q 65,80 75,45"
                     calcMode="spline"
                     keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 1 0 0 1"
                     keyPoints="0; 0.25; 0.15; 0.6; 0.82; 0.82"
                     keyTimes="0; 0.2; 0.35; 0.55; 0.70; 1"/>
      
      <!-- Disparition en fondu à la fin du cycle au lieu d'un retour en arrière -->
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.90; 0.95; 1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Le Halo de Clignotement (Eureka!) -->
    <circle r="2.5" fill="none" stroke="#ffe566" stroke-width="1.5" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 10,30 Q 20,70 32,45 T 52,35 Q 65,80 75,45"
                     calcMode="spline"
                     keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 1 0 0 1"
                     keyPoints="0; 0.25; 0.15; 0.6; 0.82; 0.82"
                     keyTimes="0; 0.2; 0.35; 0.55; 0.70; 1"/>
      
      <!-- Double flash stroboscopique déclenché au moment de l'arrêt (70%) -->
      <animate attributeName="opacity" values="0; 0; 1; 0; 1; 0; 0" keyTimes="0; 0.69; 0.70; 0.73; 0.76; 0.79; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5; 2.5; 8; 2.5; 8; 2.5; 2.5" keyTimes="0; 0.69; 0.70; 0.73; 0.76; 0.79; 1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
