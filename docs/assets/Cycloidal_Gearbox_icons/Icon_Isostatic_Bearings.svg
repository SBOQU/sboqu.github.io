  <rect x="54" y="32" width="20" height="8" fill="none" stroke="#aa00ff" stroke-width="1.5"/>
  <line x1="54" y1="40" x2="74" y2="40" stroke="#aa00ff" stroke-width="1.5"/>
  <path d="M56,40 L53,44 M62,40 L59,44 M68,40 L65,44 M74,40 L71,44" stroke="#aa00ff" stroke-width="0.8" opacity="0.6"/>

