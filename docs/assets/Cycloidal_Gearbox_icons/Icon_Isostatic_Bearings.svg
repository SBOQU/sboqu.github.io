<svg viewBox="0 0 80 80" width="80" height="80" xmlns="http://www.w3.org/2000/svg">
  
  <path d="M 8,20 Q 20,32 32,20" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.8" />
